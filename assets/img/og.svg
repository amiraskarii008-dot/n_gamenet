<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CafeLoop — Turn one-time visitors into regulars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241814"/>
      <stop offset="1" stop-color="#100a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#e0b169" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0b169" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b169"/>
      <stop offset="1" stop-color="#c8773c"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#f7efe8" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <g transform="translate(96 96)">
    <rect width="76" height="76" rx="22" fill="#c8773c"/>
    <path d="M22 30h24a8 8 0 0 1 0 16h-2a14 14 0 0 1-14 14h-2a14 14 0 0 1-14-14V38a8 8 0 0 1 8-8z" fill="#fdfaf6" opacity="0.95"/>
    <path d="M50 34h4a6 6 0 0 1 0 12h-4" fill="none" stroke="#fdfaf6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="190" y="150" fill="#f7efe8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="46" font-weight="700">CafeLoop</text>
  <text x="1104" y="156" fill="#c3b0a4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="30" text-anchor="end">cafeloop.ir</text>

  <text x="1104" y="290" fill="#f7efe8" font-family="Vazirmatn, Tahoma, sans-serif" font-size="62" font-weight="800" text-anchor="end">مشتری‌هایی که یک‌بار می‌آیند،</text>
  <text x="1104" y="378" fill="url(#gold)" font-family="Vazirmatn, Tahoma, sans-serif" font-size="62" font-weight="800" text-anchor="end">دوباره برمی‌گردند.</text>
  <text x="1104" y="452" fill="#c3b0a4" font-family="Vazirmatn, Tahoma, sans-serif" font-size="28" text-anchor="end">سیستم بازگشت مشتری برای کافه‌ها — با عدد.</text>

  <g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="end">
    <g transform="translate(1104 530)">
      <rect x="-760" y="-52" width="760" height="82" rx="18" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="-30" y="0" fill="#f7efe8" font-size="34" font-weight="700">۲.۴× نرخ بازگشت</text>
      <text x="-370" y="0" fill="#e0b169" font-size="34" font-weight="700">۸ ساعت راه‌اندازی</text>
      <text x="-640" y="0" fill="#7fd3b6" font-size="34" font-weight="700">۱۴ روز رایگان</text>
    </g>
  </g>
</svg>
